name: Daily price list update

on:
  schedule:
    - cron: '43 7 * * *'   # every day ~09:43 Israel winter time (GitHub may start it a few minutes late)
  workflow_dispatch: {}      # "Run workflow" button for a manual update

permissions:
  contents: write
  pages: write

concurrency:
  group: price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          pip install openpyxl playwright
          python -m playwright install --with-deps chromium

      - name: Download price list
        env:
          PRICING: ${{ secrets.PRICING }}
        run: |
          for i in 1 2 3; do
            python scripts/fetch.py "$RUNNER_TEMP/pricelist.xlsx" && break
            echo "attempt $i failed, retrying in 60s"; sleep 60
          done
          test -s "$RUNNER_TEMP/pricelist.xlsx"

      - name: Build data.json and meta.json
        env:
          PRICING: ${{ secrets.PRICING }}
        run: python scripts/update.py "$RUNNER_TEMP/pricelist.xlsx" .

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "pcwholesale-il"
          git config user.email "pcwholesale-il@users.noreply.github.com"
          git add data.json meta.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Price list update $(TZ=Asia/Jerusalem date +%F)"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
